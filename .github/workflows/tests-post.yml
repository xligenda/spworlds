name: Tests (with POST)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPWORLDS_API_ID: ${{ secrets.SPWORLDS_API_ID }}
      SPWORLDS_API_TOKEN: ${{ secrets.SPWORLDS_API_TOKEN }}
      SPWORLDS_TEST_ALLOW_POST: "1"
      SPWORLDS_TEST_RECEIVER_CARD: ${{ secrets.SPWORLDS_TEST_RECEIVER_CARD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race
